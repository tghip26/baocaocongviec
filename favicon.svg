<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gradient-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="32" height="32" rx="8" fill="#0b1120"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="url(#gradient-primary)" stroke-width="1.6" stroke-opacity="0.75"/>
  
  <!-- Subtle Medical Cross Background -->
  <path d="M16 6v20M6 16h20" stroke="url(#gradient-primary)" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.25"/>
  
  <!-- Active Pulse / Heartbeat Medical ECG Wave -->
  <path d="M4 16h5.5l2.5-6.5 4 13 3-9 2.5 2.5h6.5" fill="none" stroke="url(#gradient-primary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Glowing Center Spark & Status Dot -->
  <circle cx="16" cy="16" r="2.2" fill="#38bdf8"/>
  <circle cx="26" cy="6" r="2" fill="url(#gradient-accent)"/>
</svg>
